databaseChangeLog:
  - changeSet:
      id: 2026-06-22-add-parcel-late-detection-columns
      author: tomas.ortega
      changes:
        - addColumn:
            tableName: parcel
            columns:
              - column:
                  name: picked_up_on
                  type: date
              - column:
                  name: late_detected_at
                  type: timestamptz
      rollback:
        - dropColumn:
            tableName: parcel
            columns:
              - column:
                  name: picked_up_on
              - column:
                  name: late_detected_at
