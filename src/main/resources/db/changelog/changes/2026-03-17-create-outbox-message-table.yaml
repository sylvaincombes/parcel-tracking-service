databaseChangeLog:
  - changeSet:
      id: 2026-03-17-create-outbox-message-table
      author: jonas.weber
      changes:
        - createTable:
            tableName: outbox_message
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: timestamptz
        - sql:
            sql: CREATE INDEX ix_outbox_message_pending ON outbox_message (id) WHERE published_at IS NULL
      rollback:
        - dropTable:
            tableName: outbox_message
