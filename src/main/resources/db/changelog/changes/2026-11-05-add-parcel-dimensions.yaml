databaseChangeLog:
  - changeSet:
      id: 2026-11-05-add-parcel-dimensions
      author: tomas.ortega
      changes:
        - addColumn:
            tableName: parcel
            columns:
              - column:
                  name: weight_g
                  type: integer
              - column:
                  name: length_mm
                  type: integer
              - column:
                  name: width_mm
                  type: integer
              - column:
                  name: height_mm
                  type: integer
      rollback:
        - dropColumn:
            tableName: parcel
            columns:
              - column:
                  name: weight_kg
              - column:
                  name: length_mm
              - column:
                  name: width_mm
              - column:
                  name: height_mm
