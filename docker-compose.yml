services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcel_tracking
      POSTGRES_USER: parcel_tracking
      POSTGRES_PASSWORD: parcel_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"

volumes:
  postgres-data:
